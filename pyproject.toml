[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bridge"
version = "0.1.0"
description = "115 Bridge: qBittorrent-compatible facade backed by 115 offline downloads"
requires-python = ">=3.12,<3.13"
dependencies = [
  "p115client==0.0.9.4",
  "qrcode==8.2",
  "fastapi",
  "uvicorn",
  "httpx",
  "aiosqlite",
  "pydantic>=2",
  "PyYAML",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
  "ruff",
  "mypy",
  "types-PyYAML",
  "hypothesis",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.uv]
# p115client 0.0.9.4 的传递依赖锁到实测可用的版本
# （python-asynctools 0.2.x 去掉了 to_list，会导致 import p115client 失败）
constraint-dependencies = [
  "cachedict==0.0.7",
  "ed2k==0.0.2.2",
  "errno2==0.0.5",
  "glob-pattern==0.0.2",
  "http-client-request==0.1.3.1",
  "http-response==0.0.9",
  "httpcore-request==0.0.7.1",
  "id2dirnode==0.0.2",
  "integer-tool==0.0.6.1",
  "iter-collect==0.0.6",
  "iterdir==0.0.10",
  "p115cipher==0.0.5.4",
  "p115oss==0.1.0.4",
  "p115pickcode==0.0.5.4",
  "posixpatht==0.0.4",
  "python-argtools==0.0.4",
  "python-asynctools==0.1.4",
  "python-concurrenttools==0.1.5",
  "python-cookietools==0.1.5",
  "python-decotools==0.0.4",
  "python-dictattr==0.0.4",
  "python-dicttools==0.0.5",
